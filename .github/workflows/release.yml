name: Release

on:
  push:
    branches:
      - "dev/**"

permissions:
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'dev/') }}
    outputs:
      release_enabled: ${{ steps.version.outputs.release_enabled }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"

          if ($branch -notmatch '^dev/(?<major>\d+)\.(?<minor>\d+)$') {
            "release_enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Branch '$branch' does not match dev/x.y. Release skipped."
            exit 0
          }

          $major = [int]$Matches.major
          $minor = [int]$Matches.minor
          $maxBuild = 0

          git tag --list 'v*.*.*' | ForEach-Object {
            if ($_ -match '^v\d+\.\d+\.(?<build>\d+)$') {
              $maxBuild = [Math]::Max($maxBuild, [int]$Matches.build)
            }
          }

          $build = $maxBuild + 1
          $version = "$major.$minor.$build"
          $tag = "v$version"

          "release_enabled=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(($major -eq 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.release_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_name: my-heroes-clicker-win-x64.zip
            launcher_output: MyHeroesClicker.Launcher.exe
            launcher_name: My Heroes Clicker.exe
          - os: ubuntu-latest
            rid: linux-x64
            archive_name: my-heroes-clicker-linux-x64.tar.gz
            launcher_output: MyHeroesClicker.Launcher
            launcher_name: my-heroes-clicker
          - os: macos-15-intel
            rid: osx-x64
            archive_name: my-heroes-clicker-osx-x64.tar.gz
            launcher_output: MyHeroesClicker.Launcher
            launcher_name: my-heroes-clicker
    uses: ./.github/workflows/build-release-assets.yml
    with:
      os: ${{ matrix.os }}
      rid: ${{ matrix.rid }}
      archive_name: ${{ matrix.archive_name }}
      launcher_output: ${{ matrix.launcher_output }}
      launcher_name: ${{ matrix.launcher_name }}
      version: ${{ needs.version.outputs.version }}

  release:
    name: Create GitHub release
    needs:
      - version
      - build
    if: needs.version.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $previousTag = git tag --list 'v*.*.*' --sort=-v:refname | Select-Object -First 1
          $range = if ([string]::IsNullOrWhiteSpace($previousTag)) { "HEAD" } else { "$previousTag..HEAD" }
          $commits = git log $range --pretty=format:'- %s (%h)'
          $body = if ([string]::IsNullOrWhiteSpace($commits)) {
            "- Technical release."
          } else {
            $commits -join [Environment]::NewLine
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          "# My Heroes Clicker ${{ needs.version.outputs.version }}" | Set-Content $bodyPath -Encoding utf8
          "" | Add-Content $bodyPath -Encoding utf8
          $body | Add-Content $bodyPath -Encoding utf8
          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: release-assets/*
          prerelease: ${{ needs.version.outputs.prerelease }}
