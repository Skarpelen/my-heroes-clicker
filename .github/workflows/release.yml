name: Release

on:
  push:
    branches:
      - "dev/**"

permissions:
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'dev/') }}
    outputs:
      release_enabled: ${{ steps.version.outputs.release_enabled }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"

          if ($branch -notmatch '^dev/(?<major>\d+)\.(?<minor>\d+)$') {
            "release_enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Branch '$branch' does not match dev/x.y. Release skipped."
            exit 0
          }

          $major = [int]$Matches.major
          $minor = [int]$Matches.minor
          $maxBuild = 0

          git tag --list 'v*.*.*' | ForEach-Object {
            if ($_ -match '^v\d+\.\d+\.(?<build>\d+)$') {
              $maxBuild = [Math]::Max($maxBuild, [int]$Matches.build)
            }
          }

          $build = $maxBuild + 1
          $version = "$major.$minor.$build"
          $tag = "v$version"

          "release_enabled=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(($major -eq 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    if: needs.version.outputs.release_enabled == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_name: my-heroes-clicker-win-x64.zip
            launcher_output: MyHeroesClicker.Launcher.exe
            launcher_name: My Heroes Clicker.exe
          - os: ubuntu-latest
            rid: linux-x64
            archive_name: my-heroes-clicker-linux-x64.tar.gz
            launcher_output: MyHeroesClicker.Launcher
            launcher_name: my-heroes-clicker
          - os: macos-13
            rid: osx-x64
            archive_name: my-heroes-clicker-osx-x64.tar.gz
            launcher_output: MyHeroesClicker.Launcher
            launcher_name: my-heroes-clicker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MyHeroesClicker.Web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: MyHeroesClicker.Web

      - name: Build frontend
        run: npm run build
        working-directory: MyHeroesClicker.Web

      - name: Restore .NET
        run: dotnet restore MyHeroesClicker.slnx

      - name: Build .NET
        run: dotnet build MyHeroesClicker.slnx --configuration Release --no-restore /p:Version=${{ needs.version.outputs.version }} /p:FileVersion=${{ needs.version.outputs.version }} /p:AssemblyVersion=${{ needs.version.outputs.version }}

      - name: Publish application
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/package/$rid"
          $launcherPublishRoot = Join-Path $env:RUNNER_TEMP "my-heroes-clicker-launcher"

          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          New-Item -ItemType Directory -Force $launcherPublishRoot | Out-Null

          dotnet publish MyHeroesClicker.Launcher/MyHeroesClicker.Launcher.csproj --configuration Release --runtime $rid --self-contained true --output $launcherPublishRoot /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:Version=$version /p:FileVersion=$version /p:AssemblyVersion=$version
          Copy-Item -LiteralPath (Join-Path $launcherPublishRoot "${{ matrix.launcher_output }}") -Destination (Join-Path $packageRoot "${{ matrix.launcher_name }}") -Force

          dotnet publish MyHeroesClicker.API/MyHeroesClicker.API.csproj --configuration Release --runtime $rid --self-contained true --output (Join-Path $packageRoot "MyHeroesClicker.API") /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:Version=$version /p:FileVersion=$version /p:AssemblyVersion=$version
          dotnet publish MyHeroesClicker.DbMigrator/MyHeroesClicker.DbMigrator.csproj --configuration Release --runtime $rid --self-contained true --output (Join-Path $packageRoot "MyHeroesClicker.DbMigrator") /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None /p:Version=$version /p:FileVersion=$version /p:AssemblyVersion=$version

      - name: Pack Windows portable archive
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/package/${{ matrix.rid }}"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath (Join-Path $artifactDir "${{ matrix.archive_name }}") -Force

      - name: Pack Unix portable archive
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$GITHUB_WORKSPACE/artifacts/package/${{ matrix.rid }}"
          artifact_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$artifact_dir"
          chmod +x "$package_root/${{ matrix.launcher_name }}"
          chmod +x "$package_root/MyHeroesClicker.API/MyHeroesClicker.API"
          chmod +x "$package_root/MyHeroesClicker.DbMigrator/MyHeroesClicker.DbMigrator"
          tar -czf "$artifact_dir/${{ matrix.archive_name }}" -C "$package_root" .

      - name: Install Inno Setup
        if: matrix.rid == 'win-x64'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/package/win-x64"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"

          & $iscc installer/MyHeroesClicker.iss /DAppVersion=$version /DPackageRoot="$packageRoot" /DOutputDir="$artifactDir"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - version
      - build
    if: needs.version.outputs.release_enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $previousTag = git tag --list 'v*.*.*' --sort=-v:refname | Select-Object -First 1
          $range = if ([string]::IsNullOrWhiteSpace($previousTag)) { "HEAD" } else { "$previousTag..HEAD" }
          $commits = git log $range --pretty=format:'- %s (%h)'
          $body = if ([string]::IsNullOrWhiteSpace($commits)) {
            "- Technical release."
          } else {
            $commits -join [Environment]::NewLine
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          "# My Heroes Clicker ${{ needs.version.outputs.version }}" | Set-Content $bodyPath -Encoding utf8
          "" | Add-Content $bodyPath -Encoding utf8
          $body | Add-Content $bodyPath -Encoding utf8
          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: release-assets/*
          prerelease: ${{ needs.version.outputs.prerelease }}
